    <circle cx="50" cy="50" r="42" fill="#0f172a" />
    <circle cx="50" cy="50" r="32" fill="#ffffff" />
    <circle cx="50" cy="50" r="24" fill="#0f172a" />
    <!-- Gear teeth -->
    <rect x="46" y="2" width="8" height="12" fill="#0f172a" rx="2" />
    <rect x="46" y="86" width="8" height="12" fill="#0f172a" rx="2" />
    <rect x="2" y="46" width="12" height="8" fill="#0f172a" rx="2" />
